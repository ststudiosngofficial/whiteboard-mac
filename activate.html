<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Whiteboard Activation</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,sans-serif; background:#fff; color:#18181b; padding:22px; font-size:14px; }
  h1 { font-size:19px; margin-bottom:6px; }
  p.sub { opacity:.65; margin-bottom:16px; font-size:13px; }
  label { display:block; font-weight:600; margin:14px 0 6px; font-size:13px; }
  .row { display:flex; gap:8px; }
  #pid { flex:1; font-family:ui-monospace,Menlo,monospace; font-size:16px; font-weight:700; background:#f1f5f9; border:1px solid #e2e8f0; border-radius:8px; padding:9px 12px; }
  button { border:none; border-radius:8px; font-size:14px; font-weight:600; padding:10px 16px; cursor:pointer; }
  button.copy { background:#e2e8f0; color:#18181b; }
  #code { width:100%; height:110px; font-family:ui-monospace,Menlo,monospace; font-size:11px; border:1px solid #cbd5e1; border-radius:8px; padding:10px; resize:none; }
  .btnrow { display:flex; gap:8px; margin-top:14px; }
  #activateBtn { flex:1; background:#0091ff; color:#fff; font-weight:700; padding:12px; }
  #buyBtn { flex:1; background:#00c853; color:#fff; font-weight:700; padding:12px; }
  #status { color:#b91c1c; margin-top:12px; font-size:13px; min-height:20px; }
  #ok { color:#15803d; margin-top:12px; font-size:13px; min-height:20px; }
</style>
</head>
<body>
  <h1>Whiteboard requires activation</h1>
  <p class="sub">Whiteboard is locked. Look around all you like — pay &#8358;1,000 once to unlock drawing on this Mac.</p>
  <label>Your Product ID (send this to the seller after paying)</label>
  <div class="row">
    <div id="pid">…</div>
    <button class="copy" id="copyBtn">Copy</button>
  </div>
  <label>Activation code (copy + paste the long code you received)</label>
  <textarea id="code" spellcheck="false" placeholder="Paste code here"></textarea>
  <div class="btnrow">
    <button id="activateBtn">Activate</button>
    <button id="buyBtn">Buy code - &#8358;1,000</button>
  </div>
  <div id="status"></div>
  <div id="ok"></div>
<script>
  const pid = new URLSearchParams(location.search).get('pid') || '';
  document.getElementById('pid').textContent = pid || '…';
  document.getElementById('copyBtn').onclick = () => window.whiteboardAPI.copyPid();
  document.getElementById('buyBtn').onclick = () => window.whiteboardAPI.openPay();
  document.getElementById('activateBtn').onclick = async () => {
    const code = document.getElementById('code').value;
    document.getElementById('status').textContent = '';
    const res = await window.whiteboardAPI.submitCode(code);
    if (res && res.ok) {
      document.getElementById('ok').textContent = 'Activated — enjoy Whiteboard!';
    } else {
      document.getElementById('status').textContent = (res && res.error) || 'Invalid code.';
    }
  };
</script>
</body>
</html>
