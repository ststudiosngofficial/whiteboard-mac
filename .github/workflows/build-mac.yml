name: build-mac

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md']

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-14
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --mac --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      # Visual smoke test (arm64 only): launch the app, screenshot the locked board.
      - name: Smoke test (launch + screenshot)
        if: matrix.arch == 'arm64'
        run: |
          APP="dist/mac-arm64/Whiteboard.app"
          ls "$APP/Contents/MacOS"
          xattr -dr com.apple.quarantine "$APP" || true
          open "$APP"
          sleep 25
          pgrep -fl "Whiteboard" || (echo "APP_NOT_RUNNING" && exit 1)
          screencapture -x -t png /tmp/whiteboard-smoke.png
          ls -la /tmp/whiteboard-smoke.png
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: smoke-screenshot
          path: /tmp/whiteboard-smoke.png
          if-no-files-found: error
